# ============================================================
# G2P QUERY-RELATION EXTRACTOR CONFIGURATION (DEVIATION 9)
# Compatible with: config_core.yaml v1.0.0
# Replaces the IntentFFN/G2P planner with a relation-chain extractor.
# See dataclass_schema.yaml for data structure definitions.
# ============================================================

# --- API Interface Contract ---
api_interface:
  inputs:
    - subgraph: "Subgraph (from dataclass_schema.yaml)"
      description: "From Resonance Engine containing nodes/edges/activations"
  outputs:
    - type: "Plan (from dataclass_schema.yaml)"
      description: "Ordered relation_chain guiding walker + decoder"
  dependencies:
    - "config_core.yaml (relation vocabulary)"
    - "Resonance output (Subgraph)"

# --- G2P Architecture Decision (DEVIATION 9) ---
g2p_architecture:
  encoder_type: "frozen_sentence_bert"   # No intents, no IntentFFN
  justification: "Map question clauses to a relation chain via frozen embeddings; trainable components removed"
  trade_off: "Intent-level structure is lost; walker/decoder are driven by relations instead"
  frozen: true                            # Model weights are frozen (no fine-tuning)

# --- Sentence-BERT Encoder ---
sentence_bert:
  model_name: "BAAI/bge-small-en-v1.5"
  model_dim: 384
  pooling: "mean"                   # mean, cls, or max
  normalize_embeddings: true
  device: "cpu"                     # cpu or cuda if available
  batch_size: 32

# --- Extraction: question -> relation chain ---
extraction:
  similarity_threshold: 0.35        # min cosine sim between clause and descriptor
  max_chain_length: 3               # cap on ordered chain from one question
  collapse_max: 3                   # collapse consecutive repeats beyond this (causes,causes -> causes)
  clause_split:                      # split question into clauses on these tokens
    - "which"
    - "that"
    - "what"
    - "how"
    - "why"
    - "when"
    - "where"
    - "because"
    - "since"
    - ", "
    - " and "
  default_chain:                     # fallback when no relation matches (heuristic_fallback_used=True)
    - "has_property"

  # --- Relation Descriptor Bank (16 relations from config_core.yaml) ---
  # Spec skeleton: each relation maps to the relation phrase itself plus matching
  # natural-language descriptors. Descriptor phrases may be expanded by the
  # reasoning team (this file is a living deliverable).
  relation_variants:
    is_a:
      - "is a type of"
      - "is a kind of"
      - "what type of"
      - "is a"
      - "is an example of a category"
      - "belongs to the class"
    has_property:
      - "has the property"
      - "what is"
      - "what are"
      - "is characterized by"
      - "possesses"
      - "has the feature"
    causes:
      - "what causes"
      - "why does"
      - "why is"
      - "what leads to"
      - "what triggers"
      - "what results in"
      - "what brings about"
    caused_by:
      - "is caused by"
      - "what is the cause of"
      - "what triggers it"
      - "what produces"
      - "what gives rise to"
    follows:
      - "what comes after"
      - "what follows"
      - "what happens next"
      - "what occurs after"
      - "what is the next step"
    precedes:
      - "what comes before"
      - "what precedes"
      - "what happens before"
      - "what occurred prior to"
      - "what is the previous step"
    contradicts:
      - "contradicts"
      - "disagrees with"
      - "against"
      - "is the opposite claim of"
    supports:
      - "supports"
      - "is supported by"
      - "backed by"
      - "evidence for"
      - "substantiates"
    associated_with:
      - "what is associated with"
      - "what is linked to"
      - "related to"
      - "what is connected with"
      - "what goes together with"
    example_of:
      - "give me an example of"
      - "what is an example of"
      - "example of this is"
      - "for instance"
      - "instance of"
    part_of:
      - "what is part of"
      - "part of"
      - "what makes up"
      - "component of"
      - "which is contained in"
    synonym:
      - "what is another word for"
      - "synonym of"
      - "same as"
      - "another term for"
      - "means the same as"
    antonym:
      - "what is the opposite of"
      - "antonym of"
      - "opposite of"
      - "the contrary of"
    temporal_coincident:
      - "at the same time as"
      - "simultaneously with"
      - "happens at the same time as"
      - "occurs during"
    spatial_near:
      - "located near"
      - "what is near"
      - "close to"
      - "adjacent to"
      - "in the vicinity of"
    linguistic_maps:
      - "what is the term for"
      - "in what language is called"
      - "what do you call"
      - "translates to"

# --- Input/Output Validation ---
# DORMANT (DEVIATION 9): validation block is schema-only; the operative
# signal is `extraction` (query -> ordered relation chains).
validation:
  input_subgraph_max_nodes: 1000
  output_plan_max_length: 8
  output_plan_min_length: 1