# ============================================================
# RESONANCE ENGINE TEAM CONFIGURATION
# Compatible with: config_core.yaml v1.0.0
# Team: B
# ============================================================

# --- Import Core Config ---
# Inherits from config_core.yaml
# See dataclass_schema.yaml for all data structure definitions

# --- API Interface Contract ---
api_interface:
  inputs:
    - query_embedding: "np.ndarray(384,)"
    - graph: "GraphStore instance"
    - initial_seeds: "List[int]"
  outputs:
    - type: "Subgraph (from dataclass_schema.yaml)"
      description: "Resonant subgraph with activations, edges, energy"
  dependencies:
    - "config_core.yaml (embedding_regularization, analogy)"
    - "config_graph.yaml (node/edge storage)"

# --- Algorithm Parameters ---
algorithm:
  propagation_type: "wilson_cowan"  # wilson_cowan, simple_diffusion, or threshold
  normalization: "budget_soft_cap"  # budget_soft_cap, l1_norm, or none
  gate_type: "top_k"                # top_k, threshold, or none
  temporal_factor_enabled: true
  
# --- Tier 1 Parameters ---
tier1:
  propagation_threshold: 0.008      # θ_propagate
  edge_threshold: 0.02              # θ_edge
  decay_lambda: 0.1                 # λ
  top_k: 64
  max_iterations: 4                  # K (can be overridden)
  
  # Energy threshold formula (C.1): E_total > T_conf * |N_seed| * A_max
  # At runtime, final_threshold = 0.4 * len(seed_nodes) * 1.0
  energy_threshold_formula: "E_total > 0.4 * |N_seed| * 1.0"
  T_conf_coefficient: 0.4            # T_conf in formula above
  multiplied_at_runtime: true        # Runtime applies: 0.4 * seed_count * A_max
  
  relation_bias:                     # Per relation bias (θ[4:20])
    is_a: 1.0
    has_property: 0.8
    causes: 1.2
    caused_by: 1.1
    follows: 0.7
    precedes: 0.7
    contradicts: 0.3
    supports: 1.0
    associated_with: 0.5
    example_of: 0.9
    part_of: 0.8
    synonym: 1.0
    antonym: 0.4
    temporal_coincident: 0.6
    spatial_near: 0.5
    linguistic_maps: 0.7
    
# --- Tier 2 Parameters ---
tier2:
  enabled: true
  propagation_threshold: 0.04        # Lower = wider propagation
  edge_threshold: 0.08
  decay_lambda: 0.1
  top_k: 1024
  max_iterations: 8
  analogies_enabled: true
  
  # Analogy leap parameters (C.2 from core algorithm)
  analogy_parameters:
    lsh_bands: 16
    lsh_tables: 8
    temp_edge_strength: 0.5          # S_temp for temporary analogy edges
    overlap_validation_required: true
    jaccard_overlap_min: 0.3          # Minimum Jaccard overlap for validation
    mini_propagation_steps: 2         # Depth of exploration from analogous node
    edge_confidence_min: 0.5          # Only use edges with C > 0.5 for analogy
  
  analogy_lsh_bands: 16
  analogy_lsh_tables: 8
  analogy_validated_threshold: 0.5
  analogy_jaccard_overlap_threshold: 0.3
  
# --- Energy Calculation ---
energy:
  formula: "sum(activation * (strength * confidence))"
  tier1_threshold: 0.4               # T_conf * |seeds| * A_max
  tier2_min_improvement: 0.2

# --- Temporal Factor ---
temporal:
  gamma: 0.5                         # For r(T) = 1/(1+γ·log(1+Δt))
  frequency_threshold: 20            # For s(freq) = min(1.0, freq/F_thresh)
  
# --- ES Meta-Controller ---
es_controller:
  enabled: true
  theta_dim: 48
  population_size: 4                 # λ
  mu_initial:                       # Initial μ (mean)
    propagation_threshold: 0.008
    edge_threshold: 0.02
    decay_lambda: 0.1
    top_k: 64
    relation_bias_default: 1.0
  sigma_initial: 0.01                # Per-dimension std
  learning_rate: 0.02                # lr_meta
  sigma_decay_beta: 0.1
  evaluation_window: 8               # Queries between updates
  anchor_enabled: true
  anchor_lambda: 0.001               # L2 penalty to default
  
# --- Vector Indices for Theta (48 dimensions) ---
theta_indices:
  # Core parameters (indices 0-3): 4 dimensions
  propagation_threshold: 0
  edge_threshold: 1
  decay_lambda: 2
  top_k: 3
  
  # Relation biases (indices 4-19): 16 dimensions (one per relation type)
  relation_bias_start: 4
  relation_bias_end: 20             # Exclusive end (so 4..19 = 16 relations)
  
  # Reserved for future expansion (indices 20-47): 28 dimensions
  reserved_start: 20
  reserved_end: 48
  
  # Relation order (must match core config exactly):
  relation_bias_mapping:
    "index_4": "is_a"
    "index_5": "has_property"
    "index_6": "causes"
    "index_7": "caused_by"
    "index_8": "follows"
    "index_9": "precedes"
    "index_10": "contradicts"
    "index_11": "supports"
    "index_12": "associated_with"
    "index_13": "example_of"
    "index_14": "part_of"
    "index_15": "synonym"
    "index_16": "antonym"
    "index_17": "temporal_coincident"
    "index_18": "spatial_near"
    "index_19": "linguistic_maps"

# --- API Function Signatures ---
functions:
  resonate:
    signature: "resonate(query_embedding: np.ndarray, graph: GraphStore, initial_seeds: List[int], tier: int = 1) -> Subgraph"
    returns: "Subgraph with activations"
    
  resonate_with_theta:
    signature: "resonate_with_theta(theta: np.ndarray, query_embedding: np.ndarray, graph: GraphStore, initial_seeds: List[int]) -> Subgraph"
    returns: "Subgraph using provided theta vector"
    
  get_theta:
    signature: "get_theta() -> np.ndarray"
    returns: "Current theta vector (48,)"
    
  set_theta:
    signature: "set_theta(theta: np.ndarray) -> None"
    returns: "None"
    
  propose_theta_mutation:
    signature: "propose_theta_mutation() -> np.ndarray"
    returns: "Mutated theta from ES"
    
  update_es_with_reward:
    signature: "update_es_with_reward(reward: float, theta_used: np.ndarray) -> None"
    returns: "None"
    
  compute_activation_energy:
    signature: "compute_activation_energy(subgraph: Subgraph) -> float"
    returns: "Total energy E_total"
    
  check_resonance_convergence:
    signature: "check_resonance_convergence(activation_history: List[np.ndarray], epsilon: float = 0.001) -> bool"
    returns: "True if converged"
    
  get_analogy_leaps:
    signature: "get_analogy_leaps(target_node: int, graph: GraphStore, top_k: int = 3) -> List[Tuple[int, float]]"
    returns: "List of (similar_node_id, similarity_score)"

# --- Class Names ---
classes:
  main: "ResonanceEngine"
  es_controller: "EvolutionaryController"
  tier1_propagator: "Tier1Resonance"
  tier2_propagator: "Tier2Resonance"
  analogy_finder: "AnalogyFinder"

# --- Numerical Precision ---
precision:
  activation: "float32"
  theta: "float32"
  similarities: "float32"
  
# --- Diagnostics ---
diagnostics:
  log_activation_history: false
  log_theta_history: true
  history_buffer_size: 1000