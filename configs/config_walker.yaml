# ============================================================
# GRAPH WALKER TEAM CONFIGURATION
# Compatible with: config_core.yaml v1.0.0
# Team: D
# ============================================================

# --- Import Core Config ---
# Inherits from config_core.yaml
# See dataclass_schema.yaml for all data structure definitions

# --- API Interface Contract ---
api_interface:
  inputs:
    - subgraph: "Subgraph (from dataclass_schema.yaml)"
      description: "From Resonance Engine"
    - plan: "Plan (from dataclass_schema.yaml)"
      description: "From G2P Planner"
  outputs:
    - type: "WalkResult (from dataclass_schema.yaml)"
      description: "Graph walk path with activations and embeddings"
  dependencies:
    - "config_core.yaml (walker settings)"
    - "Resonance + G2P outputs"

# --- Walk Parameters ---
walk:
  max_steps: 6                     # MAX_WALK_LEN
  min_activation: 0.01
  temperature: 0.1                  # Default
  temperature_range: [0.05, 0.5]
  allow_cycles: false                # Never revisit same node
  allow_backtrack: false             # Never go back to previous node
  restart_on_dead_end: false
  restart_penalty: 0.5
  
# --- Expected-Relation to Edge Bias Mapping (DEVIATION 9) ---
# Keyed by the relation a walk step *expects* (from the query-relation chain);
# value is the bias multiplier preferred for each candidate edge relation.
relation_biases:
  is_a:
    is_a: 1.6
    has_property: 1.3
    example_of: 1.2
    default: 0.5
  has_property:
    has_property: 1.6
    part_of: 1.3
    is_a: 1.2
    default: 0.5
  causes:
    causes: 1.8
    caused_by: 1.5
    follows: 1.2
    associated_with: 1.0
    default: 0.4
  caused_by:
    caused_by: 1.8
    causes: 1.5
    precedes: 1.2
    associated_with: 1.0
    default: 0.4
  follows:
    follows: 1.6
    precedes: 1.3
    temporal_coincident: 1.2
    associated_with: 1.0
    default: 0.5
  precedes:
    precedes: 1.6
    follows: 1.3
    temporal_coincident: 1.2
    associated_with: 1.0
    default: 0.5
  contradicts:
    contradicts: 1.8
    antonym: 1.6
    associated_with: 0.9
    default: 0.4
  supports:
    supports: 1.7
    causes: 1.3
    associated_with: 1.1
    default: 0.5
  associated_with:
    associated_with: 1.6
    part_of: 1.2
    supports: 1.1
    default: 0.6
  example_of:
    example_of: 1.8
    is_a: 1.3
    has_property: 1.1
    default: 0.5
  part_of:
    part_of: 1.7
    has_property: 1.3
    is_a: 1.2
    default: 0.5
  synonym:
    synonym: 1.7
    associated_with: 1.2
    is_a: 1.0
    default: 0.5
  antonym:
    antonym: 1.8
    contradicts: 1.5
    associated_with: 0.9
    default: 0.4
  temporal_coincident:
    temporal_coincident: 1.6
    follows: 1.2
    precedes: 1.2
    associated_with: 1.0
    default: 0.5
  spatial_near:
    spatial_near: 1.6
    temporal_coincident: 1.2
    associated_with: 1.0
    default: 0.5
  linguistic_maps:
    linguistic_maps: 1.6
    synonym: 1.2
    is_a: 1.0
    default: 0.5

# --- Scoring Function ---
scoring:
  formula: "strength * confidence * target_activation * intent_bias(edge_type, current_intent)"
  
  # Weights for each factor
  weight_strength: 1.0
  weight_confidence: 1.0
  weight_target_activation: 1.0
  weight_intent_bias: 1.0
  
  normalization: "softmax"          # softmax, rank, or none
  softmax_temperature: 0.1
  
# --- Eligibility Trace Calculation ---
eligibility:
  gamma: 0.9                        # Discount factor
  formula: "sum_{t=0..K} gamma^t * source_activation(t) * (strength * confidence * temporal_factor)"
  
  # Store for credit assignment
  trace_key_format: "{source}:{target}:{relation}"
  
# --- Path Recording ---
path:
  max_length: 20
  record_activations: true
  record_timestamps: true
  record_edge_confidence: true
  
  output_format: "List[Tuple[node_id, edge_type, activation, confidence]]"

# --- API Function Signatures ---
functions:
  walk:
    signature: "walk(subgraph: Subgraph, plan: Plan) -> WalkResult"
    returns: "WalkResult with path and final embeddings"
    
  set_temperature:
    signature: "set_temperature(temperature: float) -> None"
    returns: "None"
    
  get_relation_bias:
    signature: "get_relation_bias(expected_relation: str, relation: str) -> float"
    returns: "Bias multiplier for that expected-relation/edge pair"

  update_relation_bias:
    signature: "update_relation_bias(expected_relation: str, relation: str, bias: float) -> None"
    returns: "None (for learning)"
    
  compute_eligibility_trace:
    signature: "compute_eligibility_trace(walk: WalkResult, subgraph: Subgraph) -> Dict[Tuple[int,int,str], float]"
    returns: "Eligibility E_e for each edge"
    
  get_walk_confidence:
    signature: "get_walk_confidence(walk: WalkResult) -> float"
    returns: "Geometric mean of edge confidences along path"
    
  next_possible_nodes:
    signature: "next_possible_nodes(current_node: int, subgraph: Subgraph, expected_relation: str) -> List[Tuple[int, float]]"
    returns: "List of (node_id, unnormalized_score)"

# --- Class Names ---
classes:
  main: "GraphWalker"
  scorer: "PathScorer"
  eligibility: "EligibilityTrace"
  relation_bias_table: "RelationBiasTable"

# --- Debugging ---
debug:
  log_decision_scores: false
  log_path_taken: true
  save_all_paths: false