# ============================================================
# MICRO-DECODER TEAM CONFIGURATION
# Compatible with: config_core.yaml v1.0.0
# Team: E
# ============================================================

# --- Import Core Config ---
# Inherits from config_core.yaml
# See dataclass_schema.yaml for all data structure definitions

# --- API Interface Contract ---
api_interface:
  inputs:
    - walk: "WalkResult (from dataclass_schema.yaml)"
      description: "From Graph Walker"
    - plan: "Plan (from dataclass_schema.yaml)"
      description: "From G2P Planner (for intent awareness)"
  outputs:
    - type: "Answer (from dataclass_schema.yaml)"
      description: "Natural language text with confidence and metadata"
  dependencies:
    - "config_core.yaml (intent vocabulary, decoder mode)"
    - "Walker + G2P outputs"

# --- Decoder Mode ---
mode: "template"                    # template, t5_small, or hybrid
# Fallback if template fails:
fallback_mode: "template_fallback"

# --- Template-Based Generation ---
templates:
  # Format: (intent_sequence_tuple) -> template_string
  # Special tokens: {node0}, {node1}, ... from walk path
  #                 {relation0}, {relation1} from edges
  #                 {count} for list lengths
  
  definitions:
    - intents: [0]                  # define only
      template: "A {node0} is {node1}."
      
    - intents: [0, 1]               # define + assert
      template: "A {node0} is {node1}. This means {node0} {relation0} {node2}."
      
    - intents: [1, 2, 7]            # assert + explain + example
      template: "{node0} {relation0} {node1}. This happens because {node2} {relation1} {node3}. For example, {node4}."
      
    - intents: [1]                  # assert only
      template: "{node0} {relation0} {node1}."
      
    - intents: [2]                  # explain only
      template: "The reason is that {node0} {relation0} {node1}."
      
    - intents: [4, 1]               # contrast + assert
      template: "Unlike {node0}, {node1} {relation0} {node2}."

    - intents: [3]                  # explain_effect only
      template: "As a result, {node0} {relation0} {node1}."
    - intents: [6, 8]               # list + conclude
      template: "The key points are: {node0}, {node1}, and {node2}. In summary, {node3}."
      
    - intents: [7]                  # example only
      template: "For instance, {node0} {relation0} {node1}."
      
    - intents: [10]                 # uncertain only
      template: "I'm not entirely certain, but {node0} appears to {relation0} {node1}."
      
    - intents: [11]                 # clarify only
      template: "Could you clarify whether you mean {node0} or {node1}?"
      
    - intents: [12]                 # summarize only
      template: "In summary, {node0} {relation0} {node1}."
      
    - intents: [1, 10]              # assert + uncertain
      template: "While {node0} typically {relation0} {node1}, this may not always hold."
      
    - intents: [1, 4, 1]            # assert + contrast + assert
      template: "{node0} {relation0} {node1}. However, {node2} {relation1} {node3}."
      
    - intents: [5]                  # compare only
      template: "{node0} is similar to {node1}. Both {relation0} {node2}."
      
    - intents: [9]                  # question only
      template: "Is {node0} {relation0} {node1}?"
      
    - intents: [13]                 # elaborate only
      template: "{node0} {relation0} {node1}, and more specifically, it has the following properties: {node2}."
      
    - intents: [14]                 # transition only
      template: "Now, regarding {node0}: {node1} {relation0} {node2}."
      
    - intents: [15]                 # emphasize only
      template: "Importantly, {node0} {relation0} {node1}. This is a critical point."

    - intents: [4, 1, 4]            # contrast + assert + contrast
      template: "Unlike {node0}, {node1} {relation0} {node2}. In contrast, {node3} {relation1} {node4}."

    - intents: [1, 5]               # assert + compare
      template: "{node0} {relation0} {node1}. Similarly, {node2} {relation1} {node3}."

    - intents: [6, 12]              # list + summarize
      template: "Related concepts include {node0}, {node1}, and {node2}. In summary, {node3} {relation0} {node4}."

    - intents: [4, 1, 7]            # contrast + assert + example
      template: "Unlike {node0}, {node1} {relation0} {node2}. For instance, {node3} {relation1} {node4}."

    - intents: [0, 4]               # define + contrast
      template: "A {node0} is {node1}, unlike {node2} which {relation0} {node3}."

    - intents: [4, 1]               # contrast (2-node short walk)
      template: "Unlike {node0}, {node1} stands in contrast."

    - intents: [4, 1]               # contrast (1-node minimal)
      template: "Contrasting perspective: {node0}."

    - intents: [1, 5]               # compare (2-node short walk)
      template: "{node0} relates to {node1} similarly."

    - intents: [1, 5]               # compare (1-node minimal)
      template: "Related concept: {node0}."

    - intents: [6, 12]              # list + summarize (2-node)
      template: "Key concepts: {node0}, {node1}."

    - intents: [6, 12]              # list + summarize (1-node)
      template: "Concept: {node0}."

    - intents: [0]                  # define (1-node fallback)
      template: "This relates to {node0}."

    # --- Chain-keyed templates (DEVIATION 9): keyed by relation chain, not intents ---
    - chain: ["is_a"]
      template: "{node0} is {node1}."
    - chain: ["has_property"]
      template: "{node0} has the property that {node1}: {node2}."
    - chain: ["causes"]
      template: "The reason is that {node0} {relation0} {node1}."
    - chain: ["caused_by"]
      template: "{node0} is caused by {node1}."
    - chain: ["follows"]
      template: "{node0} {relation0} {node1}."
    - chain: ["precedes"]
      template: "{node0} {relation0} {node1}."
    - chain: ["contradicts"]
      template: "{node0} {relation0} {node1}."
    - chain: ["supports"]
      template: "{node0} {relation0} {node1}."
    - chain: ["associated_with"]
      template: "{node0} {relation0} {node1}."
    - chain: ["example_of"]
      template: "For instance, {node0} {relation0} {node1}."
    - chain: ["part_of"]
      template: "{node0} is part of {node1}."
    - chain: ["synonym"]
      template: "{node0} {relation0} {node1}."
    - chain: ["antonym"]
      template: "{node0} {relation0} {node1}."
    - chain: ["temporal_coincident"]
      template: "{node0} {relation0} {node1}."
    - chain: ["spatial_near"]
      template: "{node0} {relation0} {node1}."
    - chain: ["linguistic_maps"]
      template: "{node0} {relation0} {node1}."
    - chain: ["causes", "part_of"]
      template: "{node0} {relation0} {node1} because it is part of {node2}."
    - chain: ["causes", "causes"]
      template: "{node0} {relation0} {node1}, and this in turn {relation1} {node2}."
    - chain: ["causes", "has_property"]
      template: "{node0} {relation0} {node1}, which has the property {node2}."
    - chain: ["part_of", "has_property"]
      template: "{node0} is part of {node1}, which has the property {node2}."
    - chain: ["has_property", "has_property"]
      template: "{node0} has the property {node1}, which itself has the property {node2}."
    - chain: ["is_a", "has_property"]
      template: "{node0} is {node1}, and it has the property {node2}."

  # --- Chain rendering controls (DEVIATION 9) ---
  chain_render:
    step_connector: ", and "
    no_relation_answer: "I don't have a relation in my knowledge graph that fully answers this question."

  # Slot fillers (grammatical glue)
  relation_phrases:
    is_a: "is a"
    has_property: "has"
    causes: "causes"
    caused_by: "is caused by"
    follows: "follows"
    precedes: "precedes"
    contradicts: "contradicts"
    supports: "supports"
    associated_with: "is associated with"
    example_of: "is an example of"
    part_of: "is part of"
    synonym: "is synonymous with"
    antonym: "is the opposite of"
    temporal_coincident: "coincides with"
    spatial_near: "is near"
    linguistic_maps: "relates to"
    RelatedTo: "is related to"
    Antonym: "is the opposite of"
    Synonym: "is synonymous with"

    # KG builder relations (raw connector text)
    developed: "developed"
    discovered: "discovered"
    invented: "invented"
    formulated: "formulated"
    built: "built"
    introduced: "introduced"
    is in: "is in"
    originated in: "originated in"
    is: "is"
    have: "have"
    has: "has"
    causes: "causes"
    cause: "cause"
    leads to: "leads to"

  # Start words for sentences
  sentence_starters:
    - "Therefore,"
    - "Consequently,"
    - "Additionally,"
    - "However,"
    - "Meanwhile,"
    - "Notably,"
    - "Specifically,"

# --- T5-Small Configuration (if used) ---
t5:
  model_name: "t5-small"
  max_input_length: 512
  max_output_length: 128
  num_beams: 4
  temperature: 0.7
  top_p: 0.9
  repetition_penalty: 1.2
  do_sample: true
  
  # Fine-tuning (if training from scratch)
  finetune:
    learning_rate: 3e-5
    batch_size: 8
    epochs: 3
    warmup_steps: 500
    weight_decay: 0.01

# --- Copy Attention Mechanism ---
copy_attention:
  enabled: true
  source: "walk_path_labels"        # Copy node labels directly from walk
  copy_probability: 0.3
  exact_match: true                  # Don't modify copied tokens
  
# --- Fallback Text Generation ---
fallback:
  type: "concatenate"
  separator: " "
  max_words: 200
  use_intent_prefix: false
  
  intent_prefixes:
    0: ""
    1: ""
    2: ""
    4: ""
    6: ""
    8: ""
    10: ""
    
# --- API Function Signatures ---
functions:
  decode:
    signature: "decode(walk: WalkResult, plan: Plan) -> Answer"
    returns: "Answer with generated text and confidence"
    
  decode_batch:
    signature: "decode_batch(walks: List[WalkResult], plans: List[Plan]) -> List[Answer]"
    returns: "List of Answer objects"
    
  set_mode:
    signature: "set_mode(mode: str) -> None"
    returns: "None (mode: template, t5, hybrid)"
    
  get_confidence:
    signature: "get_confidence(walk: WalkResult, plan: Plan, generated_text: str) -> float"
    returns: "Confidence ∈ [0,1] based on template match or model logits"
    
  add_template:
    signature: "add_template(intent_sequence: Tuple[int], template_string: str) -> None"
    returns: "None"
    
  load_templates:
    signature: "load_templates(filepath: str) -> None"
    returns: "None"

# --- Class Names ---
classes:
  main: "MicroDecoder"
  template_decoder: "TemplateDecoder"
  t5_decoder: "T5Decoder"
  hybrid_decoder: "HybridDecoder"
  copy_attention: "CopyAttention"

# --- Output Validation ---
validation:
  min_output_length: 5
  max_output_length: 500
  require_node_mention: true         # Must mention at least one node from walk
  max_repetitive_ngrams: 0           # Disabled for template-generated text
  reject_patterns: [": intent=", "intent=", "->", "generate:"]
